# Runs on every pull request to main: the app version must have its notes in
# CHANGELOG.md, then the tests and checks. The "Proteger a main" ruleset
# requires the "Testes" job to pass before a pull request can be merged.
name: CI

on:
  pull_request:
    branches: [main]

# A new push to the same pull request cancels the run still going.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Reading the code is all the tests need.
permissions:
  contents: read

jobs:
  test:
    name: Testes
    runs-on: windows-latest
    steps:
      # Third-party actions are pinned to a commit (the version is in the
      # comment); Dependabot moves them, see .github/dependabot.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A pull request that bumps the version brings its release notes.
      - name: Check CHANGELOG.md has the app version's notes
        shell: pwsh
        run: |
          $version = (Get-Content app/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          .github/scripts/changelog-section.ps1 -Version $version | Out-Null

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install the frontend packages
        working-directory: app
        run: npm ci

      - name: Test the driver and the engine
        run: cargo test -p d200 -p deck-engine

      - name: Build the frontend
        working-directory: app
        run: npm run build

      # The app embeds the built frontend (app/dist), hence after the build.
      - name: Check the app
        run: cargo check -p d200-deck

      - name: Check the frontend types
        working-directory: app
        run: npm run check
