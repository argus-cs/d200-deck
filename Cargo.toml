[workspace]
resolver = "2"
members = ["crates/d200", "crates/engine", "crates/steam", "app/src-tauri"]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "MIT"

# What more than one crate uses, declared once so the versions stay the same.
[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
d200 = { path = "crates/d200" }
deck-engine = { path = "crates/engine" }
hidapi = "2"
image = { version = "0.25", default-features = false }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
steam-addon = { path = "crates/steam" }
# The same version Tauri uses, so it is compiled once (features per crate).
windows = "0.62"
# The major the updater uses (one zip built), deflating with flate2's default
# backend as before; zopfli (levels above 9) is left out.
zip = { version = "4", default-features = false, features = ["deflate-flate2"] }

# The installer carries one binary: whole-program optimization makes it
# smaller, for a longer build. Not panic = "abort": a panic on an action
# thread must not take the app down (the engine's own is logged).
[profile.release]
lto = true
codegen-units = 1
strip = true
