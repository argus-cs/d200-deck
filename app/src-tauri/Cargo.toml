[package]
name = "d200-deck"
description = "Dynamic keys for the Ulanzi D200"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow.workspace = true
deck-engine.workspace = true
log.workspace = true
serde.workspace = true
# generate_context! writes the plugins' settings from tauri.conf.json as serde_json values.
serde_json.workspace = true
# The Steam addon runs inside this executable (`--addon steam`).
steam-addon.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
