[package]
name = "deck-engine"
description = "Layout, actions and device loop for the D200 Deck app"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
base64 = "0.22"
chrono.workspace = true
d200.workspace = true
env_logger = "0.11"
hidapi.workspace = true
image = { workspace = true, features = ["png", "jpeg"] }
log.workspace = true
resvg = { version = "0.48", default-features = false, features = ["text"] }
serde.workspace = true
serde_json.workspace = true
# Checks the zips of the addon catalog (addons/catalog.rs).
sha2 = "0.10"
sysinfo = { version = "0.39", default-features = false, features = ["system", "network"] }
tungstenite = "0.30"
# Iconify and addon catalog downloads.
ureq = "3"
# Unpacks the addons of the catalog.
zip.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
  "Devices_Radios",
  "Foundation",
  "Foundation_Collections",
  "Media_Control",
  "Storage_Streams",
  "Win32_Devices_Display",
  "Win32_Devices_FunctionDiscovery",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Media_Audio_Endpoints",
  "Win32_NetworkManagement_IpHelper",
  "Win32_Networking_WinSock",
  "Win32_Security",
  "Win32_System_Performance",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_JobObjects",
  "Win32_System_LibraryLoader",
  "Win32_System_Power",
  "Win32_System_Registry",
  "Win32_System_Shutdown",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_Accessibility",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
] }
# The `interface` macro (IPolicyConfig in system.rs) expands to `::windows_core` paths.
windows-core = "0.62"

# Tools with no tests: `cargo test` needn't link a harness for each (CI checks they build).
[[bin]]
name = "deckd"
test = false

[[bin]]
name = "try-catalog"
test = false

[[bin]]
name = "try-iconify"
test = false

[[bin]]
name = "try-open"
test = false

[[bin]]
name = "try-screen"
test = false

[[bin]]
name = "try-system"
test = false
