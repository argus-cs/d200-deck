[package]
name = "deck-engine"
description = "Layout, actions and device loop for the D200 Deck app"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
d200 = { path = "../d200" }
env_logger = "0.11"
hidapi = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
log = "0.4"
resvg = { version = "0.48", default-features = false, features = ["text"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.39", default-features = false, features = ["system", "network"] }
tungstenite = "0.30"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Devices_Radios",
  "Foundation",
  "Foundation_Collections",
  "Media_Control",
  "Storage_Streams",
  "Win32_Devices_Display",
  "Win32_Devices_FunctionDiscovery",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Media_Audio_Endpoints",
  "Win32_Security",
  "Win32_System_Performance",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_LibraryLoader",
  "Win32_System_Power",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_Accessibility",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
] }
# The `interface` macro (IPolicyConfig in system.rs) expands to `::windows_core` paths.
windows-core = "0.61"
